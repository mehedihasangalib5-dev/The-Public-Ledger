<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন লগইন — দ্য পাবলিক লেজার</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="assets/img/logo.png">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="../assets/img/logo.png" alt="দ্য পাবলিক লেজার লোগো" style="height:56px;width:56px;border-radius:14px;object-fit:cover;margin-bottom:12px;">
    <div class="mark">দ্য পাবলিক লেজার</div>
    <h1>অ্যাডমিন প্যানেল</h1>
    <p class="sub">চালিয়ে যেতে আপনার অ্যাকাউন্টে লগইন করুন</p>

    <div class="login-error" id="login-error">ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।</div>

    <form id="login-form">
      <div class="field">
        <label for="email">ইমেইল</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn red" id="login-btn" style="width:100%;justify-content:center;">লগইন করুন</button>
    </form>

    <div class="login-demo">
      Firebase Authentication দিয়ে লগইন হয়। Firebase কনসোলে (Authentication → Users) যে ইমেইল/পাসওয়ার্ড অ্যাকাউন্ট তৈরি করা আছে, সেটি দিয়ে সাইন-ইন করুন।
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin-auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  window.TPL_DB.seedIfNeeded().catch(() => {});

  const form = document.getElementById('login-form');
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  // Sent back here by the panel when a signed-in account has no staff role.
  if (new URLSearchParams(location.search).get('denied')) {
    err.textContent = 'এই অ্যাকাউন্টের অ্যাডমিন প্যানেলে ঢোকার অনুমতি নেই।';
    err.classList.add('show');
  }

  // If already signed in, skip straight to the dashboard.
  window.TPL_FIREBASE.auth.onAuthStateChanged((user) => {
    if (user) location.href = 'dashboard.html';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    window.TPL_AUTH.login(form.email.value.trim(), form.password.value)
      .then(() => { location.href = 'dashboard.html'; })
      .catch((e) => {
        err.textContent = e && e.code === 'app/not-staff'
          ? 'এই অ্যাকাউন্টের অ্যাডমিন প্যানেলে ঢোকার অনুমতি নেই।'
          : 'ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।';
        err.classList.add('show');
        btn.disabled = false;
      });
  });
});
</script>
</body>
</html>
