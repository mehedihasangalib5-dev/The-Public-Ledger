    </div>
    <div class="prose" style="max-width:100%;">
      <h2>প্রধান পাতা</h2>
      <ul>
        <li><a href="index.html">প্রচ্ছদ</a></li>
        <li><a href="about.html">আমাদের সম্পর্কে</a></li>
        <li><a href="contact.html">যোগাযোগ</a></li>

      </ul>
      <h2>বিভাগ</h2>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (!window.TPL_DB) { setTimeout(tryRender, 30); return; }
    window.TPL_DB.seedIfNeeded();
    document.getElementById('cat-links').innerHTML = window.TPL_DB.getCategories()
      .map(c => `<li><a href="category.html?cat=${c.slug}">${c.name_bn}</a></li>`).join('');
  };
  tryRender();
});
</script>
</body>
</html>
