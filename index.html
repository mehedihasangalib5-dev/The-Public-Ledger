<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দ্য পাবলিক লেজার — নির্ভরযোগ্য সংবাদ, স্পষ্ট বিশ্লেষণ</title>
<meta name="description" content="দ্য পাবলিক লেজার — রাজনীতি, অর্থনীতি, খেলাধুলা, বিনোদন ও প্রযুক্তির সর্বশেষ সংবাদ।">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.png">
</head>
<body>
<a href="#main" class="skip-link">মূল কনটেন্টে যান</a>
<div id="load-bar"></div>
<div id="read-bar"></div>

<header id="site-header"></header>

<main id="main">
  <div class="wrap home-grid">
    <div>
      <section id="lead-story" class="lead-story"></section>
      <div id="secondary-grid" class="secondary-grid"></div>
      <div id="category-blocks"></div>
    </div>

    <aside class="rail">
      <div class="rail-block">
        <div class="section-head"><h2>সর্বাধিক পঠিত</h2></div>
        <div id="trending-list"></div>
      </div>

      <div class="rail-block market-box">
        <h3>মুদ্রা বিনিময় হার <span class="market-live" id="market-live-dot" aria-hidden="true"></span></h3>
        <div class="market-row" data-market="usdbdt"><span>USD/BDT</span><span class="delta up" id="market-usdbdt">▲ ১২২.৮৬ (লোড হচ্ছে…)</span></div>
      </div>

      <div class="rail-block newsletter-box">
        <h3>প্রতিদিনের নিউজলেটার</h3>
        <p>সকালে আপনার ইনবক্সে দিনের গুরুত্বপূর্ণ খবরের সারসংক্ষেপ পেতে সাবস্ক্রাইব করুন।</p>
        <form id="newsletter-form">
          <input type="email" placeholder="আপনার ইমেইল" required aria-label="ইমেইল">
          <button type="submit">সাবস্ক্রাইব</button>
        </form>
        <p class="note">যেকোনো সময় আনসাবস্ক্রাইব করতে পারবেন।</p>
      </div>
    </aside>
  </div>
</main>

<footer id="site-footer"></footer>
<button id="back-to-top" aria-label="উপরে যান">↑</button>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const nf = document.getElementById('newsletter-form');
  nf.addEventListener('submit', (e) => {
    e.preventDefault();
    nf.innerHTML = '<p style="color:#fff;font-size:13.5px;margin:0;">' + TPL_I18N.t('ধন্যবাদ, আপনি তালিকাভুক্ত হয়েছেন ✓') + '</p>';
  });
});
</script>
</body>
</html>
