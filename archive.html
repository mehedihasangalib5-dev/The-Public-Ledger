<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আর্কাইভ — দ্য পাবলিক লেজার</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.png">
</head>
<body>
<a href="#main" class="skip-link">মূল কনটেন্টে যান</a>
<div id="load-bar"></div>
<header id="site-header"></header>
<div id="site-ticker" class="ticker"></div>

<main id="main">
  <div class="wrap">
    <div class="page-header">
      <span style="color:var(--ledger-red);font-weight:700;font-size:13px;">আর্কাইভ</span>
      <h1>প্রকাশিত সব প্রতিবেদন</h1>
      <p>তারিখ অনুযায়ী সাজানো — নিচে ক্লিক করে যেকোনো পুরনো প্রতিবেদন পড়ুন।</p>
    </div>
    <div id="archive-list" class="prose" style="max-width:100%;"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<button id="back-to-top" aria-label="উপরে যান">↑</button>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (!window.TPL_DB) { setTimeout(tryRender, 30); return; }
    window.TPL_DB.seedIfNeeded();
    const monthsBn = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    const all = window.TPL_DB.getPublished().sort((a,b)=> new Date(b.date)-new Date(a.date));
    const groups = {};
    all.forEach(a => {
      const d = new Date(a.date + 'T00:00:00');
      const key = `${monthsBn[d.getMonth()]} ${d.getFullYear()}`;
      (groups[key] = groups[key] || []).push(a);
    });
    const host = document.getElementById('archive-list');
    host.innerHTML = Object.entries(groups).map(([month, items]) => `
      <h2>${month}</h2>
      <ul>
        ${items.map(a => `<li><a href="article.html?slug=${a.slug}">${a.title_bn}</a> <span style="color:var(--ink-faded);font-size:13px;">— ${window.TPL_fmtDateBn(a.date)}</span></li>`).join('')}
      </ul>
    `).join('') || '<p>এখনো কোনো প্রতিবেদন প্রকাশিত হয়নি।</p>';
    setTimeout(() => window.TPL_setupReveal && window.TPL_setupReveal(), 0);
  };
  tryRender();
});
</script>
</body>
</html>
