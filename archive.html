<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আর্কাইভ — দ্য পাবলিক লেজার</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.png">
</head>
<body>
<a href="#main" class="skip-link">মূল কনটেন্টে যান</a>
<div id="load-bar"></div>
<header id="site-header"></header>

<main id="main">
  <div class="wrap">
    <div class="page-header">
      <span style="color:var(--ledger-red);font-weight:700;font-size:13px;">আর্কাইভ</span>
      <h1>প্রকাশিত সব প্রতিবেদন</h1>
      <p>তারিখ অনুযায়ী সাজানো — নিচে ক্লিক করে যেকোনো পুরনো প্রতিবেদন পড়ুন।</p>
    </div>
    <div id="archive-list" class="prose" style="max-width:100%;"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<button id="back-to-top" aria-label="উপরে যান">↑</button>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const I = window.TPL_I18N;
  const tryRender = () => {
    if (!window.TPL_DB) { setTimeout(tryRender, 30); return; }
    window.TPL_DB.seedIfNeeded().catch(() => {})
      .then(() => window.TPL_DB.getPublished())
      .then((pub) => {
        const all = pub.sort((a, b) => new Date(b.date) - new Date(a.date));
        const groups = {};
        all.forEach(a => {
          const key = I.monthYear(a.date);
          (groups[key] = groups[key] || []).push(a);
        });
        const host = document.getElementById('archive-list');
        host.innerHTML = Object.entries(groups).map(([month, items]) => `
          <h2>${month}</h2>
          <ul>
            ${items.map(a => `<li><a href="article.html?slug=${a.slug}">${I.title(a)}</a> <span style="color:var(--ink-faded);font-size:13px;">— ${I.fmtDate(a.date)}</span></li>`).join('')}
          </ul>
        `).join('') || `<p>${I.t('এখনো কোনো প্রতিবেদন প্রকাশিত হয়নি।')}</p>`;
        setTimeout(() => window.TPL_setupReveal && window.TPL_setupReveal(), 0);
      })
      .catch(() => {});
  };
  tryRender();
});
</script>
</body>
</html>
